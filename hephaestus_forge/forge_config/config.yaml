# HephaestusForge Configuration
# Generated by `hephaestus_forge init` - Edit as needed

project_name: "HephaestusProject"

# ─── System Scan Results (Auto-populated) ─────────────────────────────────────
system:
  platform: "Windows-10.0.26200"
  python_version: "3.11.9"
  python_executable: "C:/Python311/python.exe"
  ue_path: "C:/UnrealEngine/5.8"
  ue_version: "5.8.0"
  blender_path: "C:/Program Files/Blender Foundation/Blender 4.2/blender.exe"
  blender_version: "4.2.0"
  cc5_path: "C:/Program Files/Reallusion/Character Creator 5/CharacterCreator.exe"
  gpus:
    - index: 0
      name: "NVIDIA GeForce RTX 4090"
      vram_total_mb: 24576
      vram_free_mb: 22000
      driver_version: "555.85"
      cuda_version: "12.4"
  total_vram_mb: 24576
  recommended_quant: "Q4_K_M"
  vision_resolution: 768
  tts_model_size: "medium"
  warnings: []

# ─── Model Configuration ──────────────────────────────────────────────────────
models:
  planner:
    model_id: "deepseek-ai/deepseek-v4-pro-0813"
    base_url: "https://integrate.api.nvidia.com/v1"
  nemotron:
    model_id: "nvidia/nemotron-3-ultra-550b-a55b"
    quantization: "Q4_K_M"
    context_length: 131072
    rope_scaling:
      type: "linear"
      factor: 2.0
    gpu_layers: -1
    tensor_split: null

  whisper:
    model: "large-v3"
    device: "cuda"
    compute_type: "float16"
    language: "en"

  tts:
    primary: "fish-speech"
    fallback: "xtts"
    voice_cloning:
      enabled: true
      reference_audio_dir: "ProjectMemory/voice_library/references"
      embedding_cache_dir: "ProjectMemory/voice_library/embeddings"
      default_voice: "hephaestus_default"
    models:
      fish_speech:
        model_path: "models/fish-speech-1.5-q4_k_m.gguf"
        compile: true
      xtts:
        model_path: "models/xtts_v2.onnx"
      openvoice:
        model_path: "models/openvoice_v2.onnx"

  vision:
    detection: "yolo-world"
    segmentation: "sam2"
    classification: "clip"
    captioning: "florence-2"
    resolution: 512
    fps: 15
    gbuffer_capture: true

  inference:
    backend: "tensorrt-llm"
    fallback_backend: "llama.cpp"
    host: "127.0.0.1"
    port: 8080
    sampling:
      temperature: 0.3
      top_p: 0.95
      min_p: 0.05
      repeat_penalty: 1.05

# ─── Network Configuration ────────────────────────────────────────────────────
network:
  grpc_port: 50051
  webrtc_port: 8081
  dashboard_port: 3000
  tts_port: 8082
  vision_port: 8083
  dcc_bridge_port: 8084
  allowed_external:
    - "api.meshy.ai"

# ─── Paths Configuration ──────────────────────────────────────────────────────
paths:
  project_root: "."
  forge_dir: ".hephaestus_forge"
  ue_plugin_dir: "UE5_Plugin_Source/HephaestusBridge"
  agent_runtime_dir: "Agent_Runtime"
  memory_dir: "ProjectMemory"
  mission_control_dir: "MissionControl"

# ─── Agent Runtime Configuration ──────────────────────────────────────────────
agent_runtime:
  llama_server:
    enabled: true
    model_path: "Agent_Runtime/models/Nemotron-3-Ultra-Q4_K_M.gguf"
    n_gpu_layers: -1
    ctx_size: 131072
    batch_size: 512
    threads: 8
    port: 8080
    host: "127.0.0.1"
  
  tts_server:
    enabled: true
    engine: "fish-speech"
    model_path: "Agent_Runtime/models/fish-speech-1.5-q4_k_m.gguf"
    port: 8082
    host: "127.0.0.1"
    streaming: true
    sample_rate: 24000
  
  vision_stack:
    enabled: true
    detection_model: "Agent_Runtime/models/yolo_world_l.pt"
    segmentation_model: "Agent_Runtime/models/sam2_hiera_large.pt"
    classification_model: "Agent_Runtime/models/open_clip_pytorch_model.bin"
    captioning_model: "Agent_Runtime/models/florence-2-large.pt"
    device: "cuda"
    batch_size: 1
    port: 8083
    host: "127.0.0.1"
  
  dcc_bridge:
    enabled: true
    port: 8084
    host: "127.0.0.1"
    blender:
      executable: "blender"
      timeout: 300
    cc5:
      executable: "rlpython"
      timeout: 120
    meshy:
      api_key: ""  # Set in environment variable MESHY_API_KEY
      base_url: "https://api.meshy.ai/v1"
      timeout: 60

# ─── Mission Control Dashboard ────────────────────────────────────────────────
mission_control:
  port: 3000
  host: "127.0.0.1"
  enable_https: false
  ssl_cert: ""
  ssl_key: ""
  features:
    viewport_stream: true
    chain_of_thought: true
    world_outliner: true
    asset_browser: true
    voice_console: true
    performance_monitor: true

# ─── Security ─────────────────────────────────────────────────────────────────
security:
  localhost_only: true
  allowed_ips:
    - "127.0.0.1"
    - "::1"
  require_auth: false
  api_keys:
    meshy: ""  # Set via MESHY_API_KEY env var

# ─── Observability ────────────────────────────────────────────────────────────
observability:
  log_level: "INFO"
  log_format: "jsonl"
  log_dir: "logs"
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  tracing:
    enabled: true
    endpoint: "http://127.0.0.1:4318/v1/traces"
  latency_percentiles:
    - 50
    - 95
    - 99