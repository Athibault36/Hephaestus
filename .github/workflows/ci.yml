name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff, pyflakes)
        run: ruff check --select F hephaestus_forge tests
      - name: Type-check (mypy)
        run: mypy hephaestus_forge/runtime
      - name: Run tests
        run: pytest -q

  frontend:
    name: Mission Control build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hephaestus_forge/templates/mission_control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
