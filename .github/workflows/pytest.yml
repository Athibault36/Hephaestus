name: Python tests

on:
  push:
    paths:
      - "hephaestus_forge/**"
      - ".github/workflows/pytest.yml"
  pull_request:
    paths:
      - "hephaestus_forge/**"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            hephaestus_forge/requirements.txt
            hephaestus_forge/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r hephaestus_forge/requirements.txt -r hephaestus_forge/requirements-dev.txt
      - name: Run tests
        working-directory: hephaestus_forge
        run: python -m pytest tests/ -q
