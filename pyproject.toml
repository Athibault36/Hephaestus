[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hephaestus-forge"
version = "1.0.0"
description = "Local-first UE 5.8 autonomous agent factory CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "rich>=13.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
langgraph = ["langgraph>=0.2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
forge = "hephaestus_forge.forge:app_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["hephaestus_forge*"]

[tool.setuptools.package-data]
hephaestus_forge = [
  "templates/**/*",
  "forge_config/**/*",
]
